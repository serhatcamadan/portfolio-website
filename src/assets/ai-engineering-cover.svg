<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d16" />
      <stop offset="100%" stop-color="#131320" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00c8d6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00c8d6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- graph / agent network motif -->
  <g stroke="#00c8d6" stroke-width="1.4" opacity="0.55">
    <line x1="400" y1="225" x2="250" y2="140" />
    <line x1="400" y1="225" x2="560" y2="150" />
    <line x1="400" y1="225" x2="270" y2="320" />
    <line x1="400" y1="225" x2="540" y2="310" />
    <line x1="250" y1="140" x2="150" y2="200" />
    <line x1="560" y1="150" x2="650" y2="210" />
    <line x1="270" y1="320" x2="160" y2="280" />
    <line x1="540" y1="310" x2="640" y2="260" />
  </g>

  <g fill="#e0e0ea">
    <circle cx="400" cy="225" r="10" fill="#00c8d6" />
    <circle cx="250" cy="140" r="6" />
    <circle cx="560" cy="150" r="6" />
    <circle cx="270" cy="320" r="6" />
    <circle cx="540" cy="310" r="6" />
    <circle cx="150" cy="200" r="4" opacity="0.7" />
    <circle cx="650" cy="210" r="4" opacity="0.7" />
    <circle cx="160" cy="280" r="4" opacity="0.7" />
    <circle cx="640" cy="260" r="4" opacity="0.7" />
  </g>

  <text x="400" y="400" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="22" letter-spacing="4" fill="#7a7a9a">AI ENGINEERING</text>
</svg>
